services:
  # ==============================================================================
  # 1. Base de Datos PostgreSQL 15 (Con Inicialización Automática DDL + Datos)
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: vitalsenior_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vitalsenior}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vitalsenior}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vitalsenior_net

  # ==============================================================================
  # 2. Aplicación Django 6.x MVT (VitalSenior Python Backend & Frontend MVT)
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitalsenior_django_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vitalsenior}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-django-insecure-vitalsenior-dev-key-change-in-prod-1234567890}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vitalsenior_net

volumes:
  postgres_data:
    driver: local

networks:
  vitalsenior_net:
    driver: bridge
