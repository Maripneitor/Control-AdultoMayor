{% extends 'base.html' %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/90 shadow-xl shadow-slate-200/50 p-8 sm:p-10">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Recuperación Segura</h1>
            <p class="text-xs text-slate-500 mt-1 font-medium">Ingresa el correo asociado a tu cuenta para restablecer tu clave</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" name="email" id="email" required placeholder="tu-correo@ejemplo.com"
                       class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold rounded-xl shadow-lg shadow-teal-600/20 transition">
                Enviar Instrucciones
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <a href="{% url 'accounts:login' %}" class="text-xs font-bold text-slate-500 hover:text-teal-600 transition">
                &larr; Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
