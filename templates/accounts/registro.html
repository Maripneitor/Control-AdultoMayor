{% extends 'base.html' %}

{% block title %}Crear Cuenta{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10 px-4">
    <div class="max-w-lg w-full bg-white rounded-3xl border border-slate-200/90 shadow-xl shadow-slate-200/50 p-8 sm:p-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Registro en VitalSenior</h1>
            <p class="text-xs text-slate-500 mt-1 font-medium">Comienza a cuidar y monitorear a tu adulto mayor con tranquilidad</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="nombre" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre Completo</label>
                <input type="text" name="nombre" id="nombre" required placeholder="Ej. Carlos Mendoza"
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
            </div>

            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" name="email" id="email" required placeholder="carlos@correo.com"
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="telefono" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Teléfono</label>
                    <input type="tel" name="telefono" id="telefono" placeholder="9991234567"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
                <div>
                    <label for="rol" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Tipo de Cuenta</label>
                    <select name="rol" id="rol"
                            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                        <option value="familiar_admin">Familiar Administrador</option>
                        <option value="paciente">Adulto Mayor / Paciente</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                    <input type="password" name="password" id="password" required placeholder="Mínimo 8 caracteres"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
                <div>
                    <label for="password_confirm" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Confirmar Contraseña</label>
                    <input type="password" name="password_confirm" id="password_confirm" required placeholder="Repite contraseña"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold rounded-xl shadow-lg shadow-teal-600/20 hover:shadow-teal-600/30 transition">
                    Crear Cuenta
                </button>
            </div>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                ¿Ya tienes una cuenta?
                <a href="{% url 'accounts:login' %}" class="font-bold text-teal-600 hover:text-teal-700 ml-1">Inicia sesión</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
