{% extends 'base.html' %}

{% block title %}Registrar Consulta Médica - VitalSenior{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-4">
    <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm p-6 sm:p-8">
        <h1 class="text-2xl font-black text-slate-900 tracking-tight mb-1">Registrar Consulta Médica</h1>
        <p class="text-xs text-slate-500 font-medium mb-6">Guarda el diagnóstico y recomendaciones emitidas para <strong>{{ paciente.nombre_completo }}</strong></p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="motivo_consulta" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Motivo de la Consulta *</label>
                <input type="text" name="motivo_consulta" id="motivo_consulta" required placeholder="Ej. Control trimestral de hipertensión"
                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="doctor_nombre" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre del Doctor</label>
                    <input type="text" name="doctor_nombre" id="doctor_nombre" placeholder="Dr. Carlos Mendoza"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
                <div>
                    <label for="lugar_atencion" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Clínica / Hospital</label>
                    <input type="text" name="lugar_atencion" id="lugar_atencion" placeholder="Centro Médico Siglo XXI"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
            </div>

            <div>
                <label for="diagnostico_notas" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Diagnóstico, Indicaciones y Medicamentos Ajustados</label>
                <textarea name="diagnostico_notas" id="diagnostico_notas" rows="4" placeholder="Presión controlada, se sugiere reducir consumo de sal y continuar con dosis habitual..."
                          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition"></textarea>
            </div>

            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-3">
                <div class="flex items-center gap-2">
                    <input type="checkbox" name="requiere_seguimiento" id="requiere_seguimiento"
                           class="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
                    <label for="requiere_seguimiento" class="text-xs font-bold text-slate-800">Requiere Cita de Seguimiento / Revisión Posterior</label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="fecha_seguimiento" class="block text-xs font-semibold text-slate-500 mb-1">Fecha Sugerida</label>
                        <input type="date" name="fecha_seguimiento" id="fecha_seguimiento"
                               class="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-900 focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                    </div>
                    <div>
                        <label for="instrucciones_seguimiento" class="block text-xs font-semibold text-slate-500 mb-1">Instrucciones</label>
                        <input type="text" name="instrucciones_seguimiento" id="instrucciones_seguimiento" placeholder="Traer bitácora de presión"
                               class="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-900 focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                    </div>
                </div>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'appointments:lista' %}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded-xl shadow-xs transition">
                    Guardar Nota Médica
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
