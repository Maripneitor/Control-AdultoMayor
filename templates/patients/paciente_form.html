{% extends 'base.html' %}

{% block title %}{{ titulo }} - VitalSenior{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-4">
    <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm p-6 sm:p-8">
        <h1 class="text-2xl font-black text-slate-900 tracking-tight mb-2">{{ titulo }}</h1>
        <p class="text-xs text-slate-500 font-medium mb-6">Ficha clínica general y antecedentes de salud del adulto mayor.</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="nombre" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre(s) *</label>
                    <input type="text" name="nombre" id="nombre" value="{{ paciente.nombre|default:'' }}" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
                <div>
                    <label for="apellidos" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Apellidos *</label>
                    <input type="text" name="apellidos" id="apellidos" value="{{ paciente.apellidos|default:'' }}" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label for="fecha_nacimiento" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Fecha Nacimiento *</label>
                    <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" value="{{ paciente.fecha_nacimiento|date:'Y-m-d'|default:'' }}" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
                <div>
                    <label for="genero" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Género</label>
                    <select name="genero" id="genero"
                            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                        <option value="Masculino" {% if paciente.genero == 'Masculino' %}selected{% endif %}>Masculino</option>
                        <option value="Femenino" {% if paciente.genero == 'Femenino' %}selected{% endif %}>Femenino</option>
                        <option value="Otro" {% if paciente.genero == 'Otro' %}selected{% endif %}>Otro</option>
                    </select>
                </div>
                <div>
                    <label for="tipo_sangre" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Tipo de Sangre</label>
                    <input type="text" name="tipo_sangre" id="tipo_sangre" value="{{ paciente.tipo_sangre|default:'O+' }}" placeholder="Ej. O+, A+, etc."
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">
                </div>
            </div>

            <div>
                <label for="alergias" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Alergias Conocidas</label>
                <textarea name="alergias" id="alergias" rows="2" placeholder="Penicilina, sulfas, mariscos, etc."
                          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">{{ paciente.alergias|default:'' }}</textarea>
            </div>

            <div>
                <label for="enfermedades_cronicas" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Padecimientos Crónicos o Diagnósticos Base</label>
                <textarea name="enfermedades_cronicas" id="enfermedades_cronicas" rows="2" placeholder="Hipertensión arterial, Diabetes Tipo 2, etc."
                          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">{{ paciente.enfermedades_cronicas|default:'' }}</textarea>
            </div>

            <div>
                <label for="notas_cognitivas" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Observaciones Cognitivas / Cuidados Especiales</label>
                <textarea name="notas_cognitivas" id="notas_cognitivas" rows="2" placeholder="Deterioro cognitivo leve, apoyo con andadera, etc."
                          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:outline-hidden focus:ring-2 focus:ring-teal-500 transition">{{ paciente.notas_cognitivas|default:'' }}</textarea>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'patients:lista' %}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">
                    Cancelar
                </a>
                <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded-xl shadow-xs transition">
                    Guardar Ficha Clínica
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
